databaseChangeLog:
  - changeSet:
      id: 1
      author: my_name
      changes:
        - createTable:
            tableName: test_table
            columns:
              - column:
                  name: test_id
                  type: int
                  constraints:
                    primaryKey: true
              - column:
                  name: test_column
                  type: INT
      rollback:
        - dropTable:
            tableName: test_table

  - changeSet:
      id: 2
      author: my_name
      changes:
        - addColumn:
            tableName: test_table
            columns:
              - column:
                  name: nome
                  type: VARCHAR(100)
      rollback:
        - dropColumn:
            tableName: test_table
            columnName: nome