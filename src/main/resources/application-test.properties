spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create
spring.jpa.generate-ddl=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

api.security.token.secret=${JWT_SECRET:MY-SECRET-KEY}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD:}

auth0.issuer-uri=${AUTH0_ISSUER_URI:https://example.auth0.com/}
auth0.audience=${AUTH0_AUDIENCE:test-audience}
auth0.client.id=${AUTH0_CLIENT_ID:test-client-id}
auth0.client.secret=${AUTH0_CLIENT_SECRET:test-client-secret}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:test-cloud}
cloudinary.api-key=${CLOUDINARY_API_KEY:test-key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:test-secret}

feed.recent-posts-days=${FEED_RECENT_POSTS_DAYS:7}
feed.seed-interval-ms=${FEED_SEED_INTERVAL_MS:120000}
feed.max-posts-fetch-limit=${FEED_MAX_POSTS_FETCH_LIMIT:500}
