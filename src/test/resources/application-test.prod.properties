spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.generate-ddl=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.data.redis.host=${REDIS_HOST_TEST:localhost}
spring.data.redis.port=${REDIS_PORT_TEST:6379}
spring.data.redis.username=${REDIS_USERNAME_TEST}
spring.data.redis.password=${REDIS_PASSWORD_TEST}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME_TEST}
cloudinary.api-key=${CLOUDINARY_API_KEY_TEST}
cloudinary.api-secret=${CLOUDINARY_API_SECRET_TEST}

feed.recent-posts-days=7
feed.seed-interval-ms=120000
feed.max-posts-fetch-limit=500

api.security.token.secret=${JWT_SECRET:MY-SECRET-KEY}

auth0.issuer-uri=${AUTH0_ISSUER_URI}
auth0.audience=${AUTH0_AUDIENCE}
auth0.client.id=${AUTH0_CLIENT_ID}
auth0.client.secret=${AUTH0_CLIENT_SECRET}